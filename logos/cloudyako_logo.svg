<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1264 1264" width="1264" height="1264">
  <defs>
    <linearGradient id="cloudGrad" gradientUnits="userSpaceOnUse" x1="0" y1="312" x2="0" y2="880">
      <stop offset="0" stop-color="#4FC3C7"/>
      <stop offset="0.5" stop-color="#1B7FA0"/>
      <stop offset="1" stop-color="#0B3A66"/>
    </linearGradient>
    <linearGradient id="redTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8334F"/>
      <stop offset="1" stop-color="#C0132F"/>
    </linearGradient>
    <linearGradient id="redBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E0B2A"/>
      <stop offset="1" stop-color="#5E0820"/>
    </linearGradient>
    <linearGradient id="cyanTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BC4E0"/>
      <stop offset="1" stop-color="#1A8FBF"/>
    </linearGradient>
    <linearGradient id="cyanBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14608F"/>
      <stop offset="1" stop-color="#0B2A52"/>
    </linearGradient>
    <linearGradient id="orangeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#F59A1B"/>
    </linearGradient>
    <linearGradient id="orangeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8820F"/>
      <stop offset="1" stop-color="#B85A08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1264" height="1264" fill="#050E22"/>

  <!-- Cloud outline (stroked centerline, open at bottom centre) -->
  <path d="M 530 852 L 416 852 A 162 162 0 0 1 254 690 A 162 162 0 0 1 416 528 A 218 218 0 0 1 848 528 A 162 162 0 0 1 1010 690 A 162 162 0 0 1 848 852 L 735 852"
        fill="none" stroke="url(#cloudGrad)" stroke-width="64" stroke-linejoin="round"/>

  <!-- Large red diamond (top centre) -->
  <polygon points="632,418 760,543 632,523 503,543" fill="url(#redTop)"/>
  <polygon points="503,543 632,523 760,543 632,705" fill="url(#redBottom)"/>

  <!-- Left cyan gem -->
  <polygon points="466,578 613,723 383,657" fill="url(#cyanTop)"/>
  <polygon points="383,657 613,723 533,805" fill="url(#cyanBottom)"/>

  <!-- Right cyan gem (mirror) -->
  <polygon points="798,578 651,723 881,657" fill="url(#cyanTop)"/>
  <polygon points="881,657 651,723 731,805" fill="url(#cyanBottom)"/>

  <!-- Small orange gem (bottom centre) -->
  <polygon points="632,745 712,826 552,826" fill="url(#orangeTop)"/>
  <polygon points="552,826 712,826 632,925" fill="url(#orangeBottom)"/>

  <!-- Wordmark -->
  <text x="632" y="1088" text-anchor="middle" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="112" fill="#FFFFFF" textLength="650" lengthAdjust="spacingAndGlyphs">CloudYako</text>
</svg>
